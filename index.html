<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPビルダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Yomogi&display=swap" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* =========================================================
   LPビルダー（なつこ社版）v2
   左：メニュー／ミニスマホ　中央：カード（左に操作パネル・右に文言案）
   右：いまの構成
   ========================================================= */
:root{ --ui-bg:#fff; --ui-bg2:#f5f2fb; --ui-text:#3a3348; --ui-line:#e4dcf2; --ui-deep:#3A2B5C; --ui-main:#6B3FA0; }
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:#fff;color:var(--ui-text);overflow:hidden;}
button{font-family:inherit;}

/* ---------- 左メニュー ---------- */
.side-menu{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:50;background:var(--ui-bg);display:flex;flex-direction:column;gap:12px;
  padding:14px 12px 30px;font-size:13px;overflow-y:auto;box-shadow:2px 0 14px rgba(60,40,110,.10);border-right:1px solid var(--ui-line);}
.side-menu .brand{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ui-deep);font-size:16px;}
.side-menu .brand i{font-style:normal;font-size:22px;}
.side-menu .brand small{font-size:10px;font-weight:700;opacity:.55;}
.side-menu section{border-top:1px solid var(--ui-line);padding-top:10px;display:flex;flex-direction:column;gap:8px;}
.side-menu .lbl{font-size:11px;letter-spacing:.04em;opacity:.6;font-weight:700;}
.side-menu label{opacity:.75;font-size:12px;}
.side-menu input[type=text]{background:var(--ui-bg2);border:1px solid var(--ui-line);color:var(--ui-text);border-radius:6px;padding:7px 9px;font-size:12px;width:100%;font-family:inherit;}
.side-menu input[type=color]{width:30px;height:24px;border:none;border-radius:5px;background:none;padding:0;cursor:pointer;}
.side-menu input[type=range]{width:100%;accent-color:var(--ui-main);}
.side-menu select{background:var(--ui-bg2);border:1px solid var(--ui-line);color:var(--ui-text);border-radius:6px;padding:6px;font-size:12px;width:100%;font-family:inherit;}
.side-menu .crow{display:flex;align-items:center;gap:6px;justify-content:space-between;}
.tbtn{background:var(--ui-bg2);border:1px solid var(--ui-line);color:var(--ui-deep);border-radius:7px;padding:9px 11px;font-size:13px;cursor:pointer;white-space:nowrap;width:100%;text-align:center;}
.tbtn:hover{background:#ece5f8;}
.tbtn.go{background:linear-gradient(135deg,#8B6DB5,#6B3FA0);border:none;color:#fff;font-weight:700;}
.tbtn:disabled{opacity:.55;cursor:wait;}
.btn-row{display:flex;gap:6px;} .btn-row .tbtn{flex:1;padding:8px 4px;}
.seg{display:flex;flex-direction:column;gap:7px;}
.seg button{background:var(--ui-bg2);border:1px solid var(--ui-line);border-radius:10px;color:var(--ui-deep);font-size:15px;font-weight:700;padding:14px 12px;cursor:pointer;width:100%;}
.seg button.on{background:linear-gradient(135deg,#8B6DB5,#6B3FA0);border:none;color:#fff;font-weight:900;}
.preset-grid{display:flex;flex-direction:column;gap:8px;}
.preset-grid .pg-t{font-size:11px;opacity:.6;font-weight:700;margin-bottom:4px;}
.preset-grid .pg-row{display:flex;flex-wrap:wrap;gap:7px;}
.preset{width:27px;height:27px;border-radius:50%;cursor:pointer;flex:0 0 auto;border:2px solid rgba(255,255,255,.5);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .12s;}
.preset:hover{transform:scale(1.3);border-color:#fff;}
.preset.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ui-main);}
.hint{font-size:11px;line-height:1.65;opacity:.75;background:var(--ui-bg2);border-radius:8px;padding:8px;}

/* ---------- 中央ステージ ---------- */
.stage{position:fixed;top:0;bottom:0;left:486px;right:236px;overflow:auto;padding:26px 20px 200px;}
body.mini-off .stage, body.view-done .stage{left:252px;}
.storyboard{--view:.6;display:flex;flex-direction:column;align-items:center;min-height:100%;}
.sb-row{display:flex;align-items:flex-start;gap:14px;position:relative;}
.sb-row.dragging{opacity:.4;}
.sb-row.drop-before::before,.sb-row.drop-after::after{content:'';position:absolute;left:0;right:0;height:6px;background:#8B6DB5;border-radius:3px;z-index:9;}
.sb-row.drop-before::before{top:-12px;} .sb-row.drop-after::after{bottom:-12px;}
.sb-col{flex:0 0 auto;width:calc(750px * var(--view));}
.sb-zoom{zoom:var(--view);}

/* カード左の操作パネル */
.sidepanel{flex:0 0 190px;width:190px;display:flex;flex-direction:column;gap:5px;background:#fff;border:1px solid var(--ui-line);border-radius:12px;padding:8px;box-shadow:0 6px 20px rgba(40,25,70,.14);font-size:12px;}
.sidepanel .sp-drag{display:flex;align-items:center;gap:5px;cursor:grab;background:#2e2740;color:#fff;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;}
.sidepanel .sp-drag:active{cursor:grabbing;}
.sidepanel .sp-drag b{color:#c9a96e;}
.sidepanel .sp-btns{display:flex;gap:3px;}
.sidepanel .hb{flex:1;background:#f5f1fb;border:1px solid #ddd0ee;color:var(--ui-deep);border-radius:6px;font-size:13px;padding:5px 0;cursor:pointer;}
.sidepanel .hb:hover{background:#e9defa;}
.sidepanel .sp-t{font-size:11px;font-weight:900;color:#8a7fa5;text-align:center;margin-top:3px;}
.sidepanel .opt-row{display:flex;gap:4px;}
.sidepanel .opt{flex:1;background:#fff;border:2px solid #cbbfe2;color:var(--ui-deep);border-radius:8px;font-size:11px;font-weight:700;padding:6px 2px;cursor:pointer;line-height:1.3;}
.sidepanel .opt:hover{border-color:#8B6DB5;}
.sidepanel .opt.on{background:var(--ui-main);border-color:var(--ui-main);color:#fff;}
.sidepanel .ds-add{border:2px dashed #8B6DB5;color:var(--ui-main);background:#faf7ff;border-radius:8px;font-size:12px;font-weight:700;padding:6px;cursor:pointer;line-height:1.3;}
.sidepanel .ds-add:hover{background:#f0e9fb;}
.sidepanel .sp-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#8a7fa5;font-weight:700;}
.sidepanel .sp-row span{white-space:nowrap;flex:0 0 auto;}
.sidepanel .sp-row .sp-sl{flex:1 1 0;min-width:0;}
.sidepanel .sp-sl{width:100%;accent-color:var(--ui-main);cursor:pointer;}
.sidepanel input[type=color]{width:30px;height:22px;border:none;padding:0;background:none;cursor:pointer;margin-left:auto;}
.sidepanel input[type=date],.sidepanel input[type=time]{border:1px solid #cbbfe2;border-radius:6px;padding:5px 3px;font-size:11px;color:var(--ui-deep);min-width:0;font-family:inherit;}
.sidepanel .sp-row input[type=date]{flex:1.35;} .sidepanel .sp-row input[type=time]{flex:1;}
.pad{position:relative;height:54px;border-radius:8px;cursor:crosshair;touch-action:none;border:1px solid #ddd0ee;
  background:linear-gradient(#eee 1px,transparent 1px) 0 0/100% 17px,linear-gradient(90deg,#eee 1px,transparent 1px) 0 0/24px 100%,#faf9fd;}
.pad.sm{height:44px;}
.pad::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.18;pointer-events:none;}
.pad[data-pad=img]::after,.pad[data-pad=pimg]::after{content:'🖼';}
.pad[data-pad=pos]::after{content:'✥';}
.pad[data-pad=tri]::after{content:'▼';color:#6B3FA0;}
.xy-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ui-main);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none;}
.xy-lbl{font-size:10px;color:#8a7fa5;text-align:center;white-space:nowrap;}

/* カード右の文言案 */
.varstack{flex:0 0 160px;width:160px;display:flex;flex-direction:column;gap:8px;}
.varstack .varchip{color:#8a7fa5;font-size:12px;font-weight:900;}
.varside{cursor:pointer;transition:.15s;}
.varside.v1{opacity:.95;} .varside.v2{opacity:.4;filter:saturate(.6);}
.varside:hover{opacity:1;filter:none;transform:scale(1.04);}
.varside *{pointer-events:none;}
.varside .vs-head{color:var(--ui-deep);font-size:12px;font-weight:900;padding:2px 0 4px;text-align:center;}
.varside .vs-body{overflow:hidden;max-height:190px;border-radius:6px;box-shadow:0 6px 18px rgba(40,25,70,.25);
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent);}
.varside .varmini{zoom:.2;}
.varmini .noexport,.ip-mini .noexport{display:none !important;}
@keyframes snapR{0%{transform:translateX(110px);opacity:.2}70%{transform:translateX(-10px);opacity:1}100%{transform:none}}
.lp-card.snap-r{animation:snapR .32s cubic-bezier(.2,.9,.3,1.2);}

/* カードのあいだの＋ */
.insbar{display:flex;justify-content:center;align-items:center;min-height:64px;}
.insbar button.plus{width:34px;height:34px;border-radius:50%;border:2px dashed #8B6DB5;background:#fff;color:var(--ui-main);font-size:18px;font-weight:900;cursor:pointer;}
.insbar button.plus:hover{background:#f0e9fb;}
.ins-pop{position:fixed;z-index:230;background:#fff;border:2px solid #8B6DB5;border-radius:12px;box-shadow:0 14px 40px rgba(40,25,70,.35);padding:10px;display:none;
  grid-template-columns:1fr 1fr 1fr;gap:6px;width:500px;max-width:calc(100vw - 16px);max-height:76vh;overflow-y:auto;}
.ins-pop.show{display:grid;}
.ins-pop .ip-cell{background:#f5f1fb;border:1px solid #ddd0ee;color:var(--ui-deep);border-radius:7px;padding:6px 5px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.4;display:flex;flex-direction:column;gap:5px;text-align:center;}
.ins-pop .ip-cell:hover{background:#e9defa;border-color:#a988d6;}
.ins-pop .ip-mini{display:block;overflow:hidden;max-height:104px;border-radius:5px;border:1px solid #e5dcf3;background:#fff;pointer-events:none;}
.ins-pop .ip-mini .lp-card{display:block;zoom:.185;}

/* 右：いまの構成 */
.add-rail{position:fixed;right:0;top:0;bottom:0;width:236px;z-index:40;background:#fff;border-left:2px dashed #b8a5d6;padding:12px 10px 20px;overflow-y:auto;box-shadow:-4px 0 16px rgba(60,40,100,.08);}
.add-rail .t{font-size:12px;font-weight:900;color:var(--ui-main);margin-bottom:10px;text-align:center;}
.add-rail .grid{display:flex;flex-direction:column;gap:5px;}
.add-rail .ub{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid #cbb7ea;border-radius:7px;padding:9px 10px;font-size:13px;cursor:pointer;width:100%;text-align:left;white-space:nowrap;background:#e9defa;color:var(--ui-deep);}
.add-rail .ub:hover{filter:brightness(.94);}
.add-rail .ub.u2{background:#a988d6;border-color:#9678c4;color:#fff;}
.add-rail .ub.u3{background:var(--ui-main);border-color:#5a3390;color:#fff;}
.add-rail .ub span{overflow:hidden;text-overflow:ellipsis;}

/* ミニスマホ・スマホ画面 */
.mini-phone{position:fixed;left:262px;top:50%;transform:translateY(-50%);z-index:35;}
body.view-done .mini-phone, body.mini-off .mini-phone{display:none;}
.mini-wrap{zoom:.26;}
#miniScreen *{pointer-events:none;}
#miniScreen .noexport{display:none !important;}
#miniScreen .slot-cap{display:none;}
.phone{--pv:.26;position:relative;background:#17131f;border-radius:calc(96px * var(--pv));padding:calc(22px * var(--pv));box-shadow:0 34px 90px rgba(20,10,50,.45),inset 0 0 0 3px #3a3348;}
.phone-screen{width:calc(750px * var(--pv));height:calc(1624px * var(--pv));overflow-y:auto;background:#fff;border-radius:calc(84px * var(--pv));position:relative;scrollbar-width:none;}
.phone-screen::-webkit-scrollbar{display:none;}
.phone .notch{position:absolute;top:calc(34px * var(--pv));left:50%;transform:translateX(-50%);width:calc(290px * var(--pv));height:calc(58px * var(--pv));background:#000;border-radius:999px;z-index:6;pointer-events:none;}
.phone .statusbar{position:sticky;top:0;height:calc(84px * var(--pv));background:#fff;z-index:5;}
.phone .homebar{position:absolute;bottom:calc(32px * var(--pv));left:50%;transform:translateX(-50%);width:calc(250px * var(--pv));height:5px;background:rgba(255,255,255,.55);border-radius:999px;z-index:6;pointer-events:none;}
body.view-done .storyboard .noexport{display:none !important;}
body.view-done .slot-cap{display:none;}
body.view-done .phone{--pv:var(--view);margin-top:6px;}
body.view-done .phone .sb-zoom{zoom:var(--view);}

/* 文字メニュー（クリックした文字の上に出る） */
.font-bubble{position:fixed;z-index:200;background:#221d2e;border-radius:8px;padding:4px 5px;display:none;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.4);flex-wrap:wrap;max-width:720px;align-items:center;}
.font-bubble.show{display:flex;}
.font-bubble .fb-sep{width:1px;align-self:stretch;background:#4a4160;margin:0 2px;}
.font-bubble button{background:#2e2740;border:1px solid #4a4160;color:#fff;border-radius:5px;font-size:12px;padding:3px 9px;cursor:pointer;}
.font-bubble .fb-c{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;padding:0;}
.font-bubble .fb-c:hover,.font-bubble .fb-u:hover{transform:scale(1.2);}
.font-bubble .fb-cx{background:#2e2740;color:#fff;font-size:11px;font-weight:900;border:1px solid #6a6180;width:auto;padding:0 6px;border-radius:10px;}
.font-bubble input[type=color]{width:26px;height:22px;border:none;padding:0;background:none;cursor:pointer;}
.font-bubble .fb-u{background:none;border:none;color:#fff;font-weight:900;font-size:13px;padding:0 3px 1px;line-height:1.1;}
.font-bubble .fb-grip{color:#8a7fa5;cursor:grab;font-size:13px;padding:0 2px;user-select:none;}

/* カードだけの色 */
.color-pop{position:fixed;z-index:220;background:#221d2e;border-radius:10px;padding:12px;display:none;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);color:#d8d2e6;font-size:12px;min-width:190px;cursor:move;}
.color-pop.show{display:flex;}
.color-pop .cp-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.color-pop input[type=color]{width:30px;height:24px;border:none;border-radius:5px;background:none;padding:0;cursor:pointer;}
.color-pop button{background:#2e2740;border:1px solid #4a4160;color:#e9e4f4;border-radius:6px;font-size:12px;padding:5px 10px;cursor:pointer;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#4B0082;color:#fff;padding:13px 28px;border-radius:12px;font-size:14px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;}
.toast.show{opacity:1;}
.pad-overlay{position:absolute;inset:0;z-index:6;pointer-events:none;border-style:solid;border-color:rgba(107,63,160,.2);}
.hide{display:none !important;}

/* =========================================================
   LPカード本体（幅750px・書き出しは2倍の1500px）
   ========================================================= */
.lp-card{width:750px;background:#fff;box-shadow:0 8px 32px rgba(40,25,70,.16);color:var(--text);
  --main:#8B6DB5;--dark:#3A2B5C;--accent:#c9a96e;--hl:#ffe98a;--sub:#f5f1fb;--text:#1a1a1a;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;}
body[data-headfont=mincho] .lp-card{font-family:'Shippori Mincho B1',serif;}
.lp-block{position:relative;font-size:calc(30px * var(--fsc,1));padding:14px 16px;display:flex;flex-direction:column;gap:calc(.7em * var(--lhx,1));background:#fff;overflow:hidden;word-break:break-word;}
.lp-block h2{font-size:1.5em;font-weight:900;line-height:calc(1.5 * var(--lhx,1));margin:0;text-align:center;color:var(--text);}
.lp-block p{margin:0;line-height:calc(1.6 * var(--lhx,1));}
.edit{outline:none;border-radius:3px;}
.edit:hover{background:rgba(139,109,181,.09);}
.edit:focus{background:rgba(139,109,181,.14);box-shadow:0 0 0 2px rgba(139,109,181,.4);}
mark.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px;}
strong.em{color:#c2185b;font-weight:900;}
.dn-arrow{width:0;height:0;border-left:var(--arxpx,34px) solid transparent;border-right:var(--arxpx,34px) solid transparent;border-top:calc(30px * var(--arw,1)) solid var(--tric,var(--main));margin:6px auto 0;}
.lp-imgslot{position:relative;display:flex;align-items:flex-end;justify-content:center;background-color:#f1ecf7;background-size:cover;background-position:center;border:2px dashed #b8a5d6;cursor:pointer;overflow:hidden;}
.lp-imgslot.filled{border-style:solid;border-color:#ddd4ec;}
.lp-imgslot .slot-cap{background:rgba(255,255,255,.88);color:#7a68a0;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:6px;pointer-events:none;white-space:nowrap;}
.slot-hbtns{position:absolute;bottom:6px;right:6px;display:flex;gap:5px;z-index:5;}
.slot-hbtns button{background:rgba(24,20,32,.85);color:#fff;border:none;border-radius:8px;font-size:16px;padding:8px 14px;cursor:pointer;}
.slot-hbtns button:hover{background:var(--ui-main);}
.ar-169{aspect-ratio:16/9;} .ar-11{aspect-ratio:1/1;} .ar-43{aspect-ratio:4/3;}
.itemdel{position:absolute;right:-11px;top:-11px;width:32px;height:32px;border-radius:50%;background:#c0392b;color:#fff;border:2px solid #fff;cursor:pointer;font-size:16px;font-weight:900;line-height:1;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.35);display:none;}
.li-wrap{position:relative;}
.li-wrap:hover>.itemdel,td.li-wrap:hover>.itemdel{display:block;}
/* 上に切り込む三角 */
.lp-cause,.lp-recommend{padding-top:calc(34px * var(--arw,1) + var(--padYv,14px)) !important;}
.lp-cause::before,.lp-recommend::before,.lp-method::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;z-index:1;
  border-left:var(--arxpx,45px) solid transparent;border-right:var(--arxpx,45px) solid transparent;border-top:calc(34px * var(--arw,1)) solid var(--tric,#fff);}

/* 帯フック */
.lp-eyebrow{background:var(--dark);color:#fff;text-align:center;padding-top:22px;padding-bottom:22px;}
.lp-eyebrow .txt{font-size:1.02em;font-weight:700;line-height:calc(1.75 * var(--lhx,1));}
/* ヒーロー */
.lp-hero{background:var(--sub);gap:.5em;padding-bottom:18px;}
.lp-hero .lp-hand{font-size:1.05em;line-height:calc(1.6 * var(--lhx,1));}
.lp-hero .lp-flow{position:relative;}
.lp-hero .lp-flow>.hero-side{position:absolute;top:0;left:54%;width:46%;z-index:0;}
.lp-hero .hero-side .lp-imgslot,.lp-hero .hero-stack .lp-imgslot{width:100% !important;}
.lp-hero .hero-side .lp-name{margin-top:.35em;text-align:right;}
.lp-hero .lp-flow>.lp-title,.lp-hero .lp-flow>.lp-sub{position:relative;z-index:1;}
.lp-hero .hero-stack{margin:.2em auto 0;}
.lp-hero .hero-stack .lp-name{text-align:center;}
.lp-hero .lp-title{font-size:2.2em;font-weight:900;line-height:calc(1.4 * var(--lhx,1));margin:0;}
.lp-hero .lp-title mark.hl{background:linear-gradient(transparent 60%,var(--hl) 60%);}
.lp-hero .lp-sub{font-size:.95em;line-height:calc(1.8 * var(--lhx,1));}
.lp-hero .lp-name{font-size:.88em;opacity:.8;font-weight:700;text-align:right;margin-top:.3em;}
/* 実績メダル */
.lp-badges{background:var(--sub);padding-top:10px;padding-bottom:10px;}
.lp-badges .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.lp-badges .row:has(.medal:nth-child(4)):not(:has(.medal:nth-child(5))){max-width:452px;margin:0 auto;}
.lp-badges .medal{width:210px;height:210px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,#fff);border:3px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.15),inset 0 0 0 5px #fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:14px;}
.lp-badges .medal .label{font-size:.88em;font-weight:700;color:color-mix(in srgb,var(--accent) 60%,#333);line-height:calc(1.4 * var(--lhx,1));}
.lp-badges .medal .num{font-size:1.7em;font-weight:900;line-height:calc(1.15 * var(--lhx,1));}
.lp-badges .medal.sq{border-radius:0;width:212px;height:180px;}
/* ブリッジ */
.lp-bridge{text-align:center;background:#fff;padding-top:14px;padding-bottom:14px;}
.lp-bridge .txt{font-size:1.42em;font-weight:900;line-height:calc(1.55 * var(--lhx,1));}
/* CTA */
.lp-cta{background:var(--dark);color:#fff;text-align:center;align-items:center;gap:calc(.5em * var(--lhx,1));padding-top:26px;padding-bottom:26px;}
.lp-cta .heading{font-size:1.2em;font-weight:900;line-height:calc(1.5 * var(--lhx,1));color:#fff;}
.lp-cta .badge{display:inline-block;background:#fff;color:#c0392b;font-weight:900;font-size:.92em;padding:8px 22px;border-radius:999px;}
.lp-cta .cbtn{display:block;width:94%;padding:22px 10px;border-radius:14px;text-align:center;background:var(--btnc,#06c755);margin:calc(.5em * var(--lhx,1)) 0;
  border:2px solid color-mix(in srgb,var(--btnc,#06c755) 55%,#000);box-shadow:0 6px 0 color-mix(in srgb,var(--btnc,#06c755) 42%,#000),0 10px 22px rgba(0,0,0,.35);color:#fff;font-size:1.32em;font-weight:900;letter-spacing:.04em;}
.lp-cta .cbtn.sem{--btnc-d:#e0392b;background:var(--btnc,#e0392b);border-color:color-mix(in srgb,var(--btnc,#e0392b) 55%,#000);box-shadow:0 6px 0 color-mix(in srgb,var(--btnc,#e0392b) 42%,#000),0 10px 22px rgba(0,0,0,.35);}
.lp-cta .bs-sq{border-radius:0;} .lp-cta .bs-pill{border-radius:999px;}
/* 悩みチェック */
.lp-problem{background:var(--sub);}
.lp-problem ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(12px * var(--lhx,1));}
.lp-problem li{background:var(--pbc,#fff);padding:16px 18px 16px 70px;font-size:.95em;line-height:calc(1.65 * var(--lhx,1));position:relative;box-shadow:0 2px 8px rgba(40,25,70,.08);}
.lp-problem li::before{content:'!';position:absolute;left:16px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--pmc,var(--hl));color:#8a6d00;font-weight:900;text-align:center;line-height:38px;font-size:1.05em;}
.lp-problem ul.chk li::before{content:'✓';background:var(--pmc,var(--main));color:#fff;}
/* 原因 */
.lp-cause{background:var(--dark);color:#fff;text-align:center;}
.lp-cause .lead{font-size:1em;font-weight:700;opacity:.92;line-height:calc(1.85 * var(--lhx,1));}
.lp-cause .keys{font-size:1.32em;font-weight:900;color:var(--hl);line-height:calc(1.75 * var(--lhx,1));border-top:calc(2px * var(--lnw,1)) solid var(--lnc,var(--hl));border-bottom:calc(2px * var(--lnw,1)) solid var(--lnc,var(--hl));padding:14px 6px;}
.lp-cause .body{font-size:.95em;line-height:calc(1.95 * var(--lhx,1));}
/* メソッド */
.lp-method{text-align:center;background:#fff;padding-top:0 !important;gap:.8em;}
.lp-method .propose{background:var(--dark);color:#fff;font-weight:900;font-size:.95em;padding:calc(12px + 34px * var(--arw,1)) 12px 12px;margin:0 -80px .4em;}
.lp-method .tab{display:inline-block;background:var(--accent);color:#fff;font-size:.68em;font-weight:900;padding:4px 16px;align-self:center;}
.lp-method .namebox{background:var(--dark);color:#fff;font-size:1.45em;font-weight:900;padding:20px 14px;line-height:calc(1.55 * var(--lhx,1));}
.lp-method .namebox .gold{color:var(--accent);}
.lp-method .x{font-size:1.2em;font-weight:900;}
.lp-method .crossbox{background:var(--dark);color:var(--hl);font-size:1.18em;font-weight:900;padding:12px;display:inline-block;align-self:center;min-width:62%;}
.lp-method .body{font-size:.95em;line-height:calc(1.9 * var(--lhx,1));}
/* 比較表 */
.lp-compare table{width:100%;border-collapse:collapse;font-size:.8em;}
.lp-compare th,.lp-compare td{border:1px solid #d9d2e6;padding:12px 10px;text-align:center;line-height:calc(1.6 * var(--lhx,1));}
.lp-compare thead th{font-weight:900;}
.lp-compare thead th.a{background:color-mix(in srgb,var(--accent) 16%,#fff);}
.lp-compare thead th.b{background:var(--main);color:#fff;}
.lp-compare td.k{background:color-mix(in srgb,var(--accent) 16%,#fff);font-weight:700;width:calc(96px * var(--kw,1));font-size:.92em;}
.lp-compare td.b{background:color-mix(in srgb,var(--hl) 38%,#fff);font-weight:700;}
/* 未来 */
.lp-future{background:#fff8e0;}
.lp-future .cap{background:var(--hl);color:#5b4a00;font-weight:900;font-size:1.02em;text-align:center;padding:13px;line-height:calc(1.65 * var(--lhx,1));}
.lp-future .closing{font-size:1.3em;font-weight:900;text-align:center;line-height:calc(1.75 * var(--lhx,1));}
/* 特典 */
.lp-benefits{background:var(--main);}
.lp-benefits h2{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.25);}
.lp-benefits .lead{color:#fff;text-align:center;font-size:.9em;opacity:.95;}
.lp-benefits .bcard{background:#fff;display:grid;grid-template-columns:64px 1fr 84px;gap:12px;align-items:center;padding:14px 14px 14px 10px;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.lp-benefits.noicon .bcard{grid-template-columns:64px 1fr;}
.lp-benefits .ribbon{background:var(--hl);color:#6d5600;text-align:center;font-weight:900;padding:10px 0;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.lp-benefits .ribbon .rl{font-size:.6em;letter-spacing:1px;}
.lp-benefits .ribbon .rn{font-size:1.3em;line-height:1;}
.lp-benefits .bt h3{font-size:1em;margin:0 0 4px;line-height:calc(1.5 * var(--lhx,1));}
.lp-benefits .bt p{font-size:.85em;line-height:calc(1.55 * var(--lhx,1));}
.lp-benefits .bicon{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;}
.lp-benefits.simple .bcard .ribbon{clip-path:none;background:var(--main);color:#fff;}
.lp-benefits.simple .bcard{box-shadow:none;border:2px solid color-mix(in srgb,var(--main) 40%,#fff);}
.lp-benefits .consult{border:3px solid var(--accent);background:#fff6e2;}
.lp-benefits .consult .ribbon{background:var(--accent);color:#fff;}
/* ステップ */
.lp-steps{padding-top:0;--sgap:calc(22px * var(--lhx,1));}
.lp-steps .strip{background:var(--main);color:#fff;font-weight:900;text-align:center;font-size:1.1em;padding:14px;margin:0 -40px .5em;}
.lp-steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.lp-steps li{position:relative;background:#fff;box-shadow:0 2px 10px rgba(40,25,70,.12);padding:17px 18px 17px 118px;font-size:.95em;font-weight:700;line-height:calc(1.6 * var(--lhx,1));}
.lp-steps li+li{margin-top:var(--sgap);}
.lp-steps li+li::before{content:'';position:absolute;left:50%;top:calc(-1 * var(--sgap));height:var(--sgap);width:2px;background:var(--main);}
.lp-steps.arrow{--sgap:max(calc(22px * var(--lhx,1)),calc(15px * var(--stw,1) + 10px));}
.lp-steps.arrow li+li::before{width:0;height:0;background:none;transform:translateX(-50%);border-left:calc(13px * var(--stw,1)) solid transparent;border-right:calc(13px * var(--stw,1)) solid transparent;
  border-top:calc(15px * var(--stw,1)) solid var(--stc,var(--main));top:calc((var(--sgap) + 15px * var(--stw,1)) / -2);}
.lp-steps li .n{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:2em;font-weight:900;color:color-mix(in srgb,var(--main) 45%,#fff);line-height:1;}
/* こんな方へ */
.lp-recommend{background:var(--dark);color:#fff;}
.lp-recommend h2{color:#fff;}
.lp-recommend ul,.lp-guarantee ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(12px * var(--lhx,1));}
.lp-recommend li,.lp-guarantee li{padding:15px 16px 15px calc(20px + 34px * var(--ckw,1));font-size:.92em;line-height:calc(1.65 * var(--lhx,1));position:relative;}
.lp-recommend li{background:#fff;color:var(--text);}
.lp-guarantee li{background:var(--sub);}
.lp-recommend li::before,.lp-guarantee li::before{content:'✓';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:calc(34px * var(--ckw,1));height:calc(34px * var(--ckw,1));border-radius:50%;
  background:var(--ckc,var(--accent));color:#fff;font-weight:900;text-align:center;line-height:calc(34px * var(--ckw,1));font-size:calc(19px * var(--ckw,1));}
.lp-guarantee li::before{background:var(--ckc,#059669);}
/* プロフィール */
.lp-profile{background:var(--sub);background-image:repeating-linear-gradient(0deg,transparent,transparent 26px,rgba(139,109,181,.07) 27px),repeating-linear-gradient(90deg,transparent,transparent 26px,rgba(139,109,181,.07) 27px);}
.lp-profile .who{text-align:center;font-size:1.02em;font-weight:900;line-height:calc(1.7 * var(--lhx,1));}
.lp-profile .prow{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start;}
.lp-profile .strips{display:flex;flex-direction:column;gap:calc(10px * var(--lhx,1));justify-content:center;padding-top:12px;}
.lp-profile .strips .st{background:var(--hl);font-size:.8em;font-weight:700;padding:9px 12px;line-height:calc(1.6 * var(--lhx,1));}
.lp-profile .story{background:#fff;border:2px solid var(--main);padding:24px 26px;font-size:.88em;line-height:calc(2.05 * var(--lhx,1));}
/* お客さまの声 */
.lp-voice{background:#fdf9ef;gap:1.4em;}
.lp-voice .note{text-align:center;font-size:.75em;opacity:.65;margin-top:-6px;}
.lp-voice .vcard{border:2px solid #e79ab5;background:#fff;padding:20px;display:flex;flex-direction:column;gap:calc(11px * var(--lhx,1));margin-top:calc(14px * var(--lhx,1));}
.lp-voice .tag{align-self:center;background:var(--hl);font-size:.85em;font-weight:900;padding:4px 18px;margin-top:-34px;}
.lp-voice .vt{font-weight:900;text-align:center;font-size:1.05em;line-height:calc(1.6 * var(--lhx,1));}
.lp-voice .vb{font-size:.85em;line-height:calc(1.9 * var(--lhx,1));}
/* 不安解消 */
.lp-faq .worry{display:flex;flex-direction:column;}
.lp-faq .wq{display:flex;gap:14px;align-items:center;padding:calc(13px * var(--lhx,1)) 4px;border-bottom:1px solid #e2d9b8;font-size:.92em;font-weight:700;line-height:calc(1.6 * var(--lhx,1));}
.lp-faq .wq::before{content:'✓';flex:0 0 40px;height:40px;border-radius:50%;background:#b8942e;color:#fff;font-weight:900;text-align:center;line-height:40px;font-size:1em;}
.lp-faq .ans{background:var(--sub);padding:22px 24px;font-size:.88em;line-height:calc(2 * var(--lhx,1));margin-top:12px;}
/* 開催概要 */
.lp-seminar .tablewrap{display:flex;flex-direction:column;}
.lp-seminar .irow{display:flex;border-bottom:1px solid #ddd4ec;}
.lp-seminar .irow:last-child{border-bottom:none;}
.lp-seminar .ik{flex:0 0 100px;background:var(--dark);color:#fff;font-size:.8em;font-weight:800;display:flex;align-items:center;justify-content:center;padding:13px 8px;}
.lp-seminar .iv{flex:1;background:var(--sub);padding:13px 16px;font-size:.9em;line-height:calc(1.65 * var(--lhx,1));}
.lp-seminar .agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(8px * var(--lhx,1));}
.lp-seminar .agenda li{position:relative;padding-left:24px;font-size:.88em;line-height:calc(1.65 * var(--lhx,1));}
.lp-seminar .agenda li::before{content:'●';position:absolute;left:2px;top:6px;color:var(--main);font-size:.6em;}
.lp-seminar .subh{font-size:.95em;font-weight:800;margin-top:8px;}
.lp-seminar .sem-dates{display:flex;flex-direction:column;gap:calc(6px * var(--lhx,1));}
.lp-seminar .sd{display:flex;gap:2px;align-items:center;font-weight:800;}
.lp-card .wd{font-weight:900;} .lp-card .wd.wsat{color:#2563EB;} .lp-card .wd.wsun{color:#D2453B;}
/* ビフォーアフター */
.lp-before-after .ba-pair{display:grid;gap:10px;}
.lp-before-after .ba-pair.h{grid-template-columns:1fr 40px 1fr;align-items:center;}
.lp-before-after .ba-pair.v{grid-template-columns:1fr;}
.lp-before-after .col{display:flex;flex-direction:column;gap:10px;background:var(--sub);padding:16px;}
.lp-before-after .col.af{background:#fffbe6;border:2px solid var(--accent);}
.lp-before-after .lbl{font-size:.8em;font-weight:900;text-align:center;padding:5px 0;background:#9aa1ad;color:#fff;border-radius:999px;}
.lp-before-after .col.af .lbl{background:var(--accent);}
.lp-before-after .btx{font-size:.84em;line-height:calc(1.7 * var(--lhx,1));}
.lp-before-after .arw{font-size:1.7em;color:var(--main);text-align:center;font-weight:900;}
/* 締切 */
.lp-limited{background:color-mix(in srgb,var(--main) 8%,#fff);}
.lp-limited .lim-deadline{background:var(--main);color:#fff;font-weight:900;text-align:center;padding:14px;font-size:1.12em;line-height:calc(1.5 * var(--lhx,1));}
.lp-limited .lim-body{text-align:center;font-size:.95em;line-height:calc(1.7 * var(--lhx,1));}
/* 追伸 */
.lp-message{background:var(--sub);}
.lp-message .story{background:#fff;padding:26px 28px;font-size:.9em;line-height:calc(2.1 * var(--lhx,1));}
/* 参加費 */
.lp-price .normal{text-decoration:line-through;opacity:.55;text-align:center;font-size:1.05em;font-weight:700;}
.lp-price .special{font-size:2.2em;font-weight:900;color:#c0392b;text-align:center;line-height:calc(1.3 * var(--lhx,1));}
.lp-price .pnote{text-align:center;font-size:.8em;opacity:.75;}
/* 当日の流れ */
.lp-flow .frow{display:flex;gap:12px;align-items:center;}
.lp-flow .ftime{flex:0 0 92px;background:var(--dark);color:#fff;text-align:center;font-weight:900;padding:9px 4px;font-size:.85em;}
.lp-flow .flabel{flex:1;border-bottom:1px dashed #cfc4e4;padding:9px 2px;font-size:.92em;line-height:calc(1.6 * var(--lhx,1));}
/* 動画 */
.lp-video .vwrap{position:relative;}
.lp-video .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
.lp-video .vplay span{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--main);box-shadow:0 6px 20px rgba(0,0,0,.3);padding-left:8px;}
.lp-video .vcap{text-align:center;font-size:.85em;opacity:.8;}
/* フリー */
.lp-free .free-body{font-size:.95em;line-height:calc(2 * var(--lhx,1));}
/* フッター */
.lp-footer{background:#241d33;color:#cfc8dd;text-align:center;padding-top:30px;padding-bottom:30px;gap:calc(.5em * var(--lhx,1));}
.lp-footer .org{font-weight:800;color:#fff;font-size:.95em;line-height:calc(1.5 * var(--lhx,1));}
.lp-footer .cr{font-size:.78em;opacity:.65;line-height:calc(1.5 * var(--lhx,1));}

/* ダーク配色 */
body[data-lpmode=dark] .lp-card{background:#0e0b15;}
body[data-lpmode=dark] .lp-block{background:#14101d;}
body[data-lpmode=dark] :is(.lp-cause,.lp-recommend,.lp-method){--tric:#0e0b15;}
body[data-lpmode=dark] :is(.lp-problem li,.lp-steps ol li,.lp-benefits .bcard,.lp-voice .vcard,.lp-profile .story,.lp-message .story,.lp-recommend li,.lp-guarantee li,.lp-faq .ans,.lp-before-after .col,.lp-seminar .iv,.lp-flow .flabel,.lp-method .namebox){background:#1e1830;color:var(--text);}
body[data-lpmode=dark] .lp-compare td{background:#1e1830;color:var(--text);border-color:#3a3150;}
body[data-lpmode=dark] .lp-compare td.k{background:#171226;}
body[data-lpmode=dark] .lp-compare td.b{background:#2a2242;}
body[data-lpmode=dark] .lp-badges .medal{background:color-mix(in srgb,var(--accent) 22%,#14101d);box-shadow:none;}
body[data-lpmode=dark] .lp-benefits .consult,body[data-lpmode=dark] .lp-before-after .col.af{background:#241c38;}
body[data-lpmode=dark] mark.hl{color:#fff;}
</style>
</head>
<body data-headfont="gothic">

<aside class="side-menu" id="sideMenu">

      <button data-view="edit" class="on">◫ 分割して編集</button>
      <button data-view="phone">📱 スマホ画面</button>
    </span>
    <button class="tbtn" id="miniToggle">🖥 ミニプレビューを隠す</button>
    <button class="tbtn" id="syncToggle">🔗 スクロール連動：ON</button>
    <div class="crow"><label>表示サイズ</label></div>
    <input type="range" id="view" min="0.3" max="1" step="0.02" value="0.6">
    <button class="tbtn" id="undoBtn" title="直前の操作を取り消す（Ctrl+Z）">↩ 元に戻す</button>
  </section>

  <section>
    <div class="lbl">配色（なぞってプレビュー・クリックで決定）</div>
    <div class="preset-grid" id="presetRow"></div>
    <div class="crow"><label>メイン</label><input type="color" id="c-main"></div>
    <div class="crow"><label>濃</label><input type="color" id="c-dark"></div>
    <div class="crow"><label>差し色</label><input type="color" id="c-accent"></div>
    <div class="crow"><label>マーカー</label><input type="color" id="c-hl"></div>
    <select id="headfont"><option value="gothic">ゴシック体（全体）</option><option value="mincho">明朝体（全体）</option></select>

  <section>

      <option value="">ひな形から作りなおす…</option>
      <option value="natsuko">なつこLP（人生違和感診断）</option>
      <option value="line">LINE登録LPのひな形</option>
      <option value="seminar">セミナー集客LPのひな形</option>
      <option value="blank">まっさら</option>
    </select>
    <div class="hint">作ったLPはこのパソコンのブラウザに自動で残ります。別のパソコンへ持っていくときは「💾 保存」でファイルにしてください。</div>
  </section>
</aside>
<div class="ins-pop" id="insPop"></div>

<main class="stage" id="stage"><div class="storyboard" id="storyboard"></div></main>
<aside class="add-rail" id="addRail"></aside>
<aside class="mini-phone" id="miniPhone">
  <div class="phone"><div class="notch"></div><div class="phone-screen" id="miniScreen"></div><div class="homebar"></div></div>
</aside>

<input type="file" id="filePick" accept=".json,application/json" hidden>
<input type="file" id="imgPick" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<div class="font-bubble" id="fontBubble">

  <button data-fb="minus" title="この文字を小さく">A−</button><button data-fb="plus" title="この文字を大きく">A＋</button><button data-fb="reset" title="大きさを元に戻す">↺</button>

  <span class="fb-sep"></span>
  <button class="fb-c" data-fbc="#D2453B" style="background:#D2453B" title="選んだ文字を赤に"></button>
  <button class="fb-c" data-fbc="#2563EB" style="background:#2563EB" title="選んだ文字を青に"></button>
  <button class="fb-c" data-fbc="#059669" style="background:#059669" title="選んだ文字を緑に"></button>
  <button class="fb-c" data-fbc="#b8860b" style="background:#b8860b" title="選んだ文字を金に"></button>

/* 文字の記法：改行・**強調**・==マーカー==・{{#色|部分色}}・{{u#色|下線}} */
function rich(s){
  return esc(s)
    .replace(/\{\{u(#[0-9a-fA-F]{3,8})\|([^}\n]+?)\}\}/g,'<span class="ulx" style="text-decoration:underline;text-decoration-color:$1;text-decoration-thickness:.14em;text-underline-offset:.12em">$2</span>')
    .replace(/\{\{(#[0-9a-fA-F]{3,8})\|([^}\n]+?)\}\}/g,'<span style="color:$1">$2</span>')
    .replace(/\*\*([^*\n]+?)\*\*/g,'<strong class="em">$1</strong>')
    .replace(/==([^=\n]+?)==/g,'<mark class="hl">$1</mark>')
    .replace(/\n/g,'<br>');
}
function toHex(c){
  if(!c) return null;
  if(c[0]==='#') return c;
  const m=String(c).match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if(!m) return null;
  return '#'+[m[1],m[2],m[3]].map(n=>(+n).toString(16).padStart(2,'0')).join('');
}
/* 書きかえた画面の文字 → 記法に戻す（色・下線・太字・マーカーを保ったまま保存） */
function domToMarkup(node){
  let out='';
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){ out+=n.nodeValue.replace(/ /g,' '); return; }
    if(n.nodeType!==1) return;
    const tag=n.tagName;
    if(tag==='BR'){ out+='\n'; return; }
    if(n.classList.contains('noexport')) return;
    let inner=domToMarkup(n);
    if(tag==='DIV'||tag==='P'){ if(out && !out.endsWith('\n')) out+='\n'; out+=inner; return; }
    if(!inner) return;
    if(tag==='MARK'){ out+='=='+inner+'=='; return; }
    if(tag==='STRONG'||tag==='B'){ out+='**'+inner+'**'; return; }
    const st=n.style;
    const deco=(st.textDecorationLine||st.textDecoration||'');
    if(n.classList.contains('ulx')||tag==='U'||deco.includes('underline')){
      inner='{{u'+(toHex(st.textDecorationColor)||'#F8A9C4')+'|'+inner+'}}';
    }
    const col=toHex(st.color)||(tag==='FONT'?n.getAttribute('color'):null);
    if(col) inner='{{'+col+'|'+inner+'}}';
    out+=inner;
  });
  return out;
}

/* 見た目（レイアウト）の設定＝文言案を切りかえても変わらないもの */
const LAYOUT_KEYS=['id','type','imgs','fs','slotH','slotW','imgX','imgY','titleW','lay','fscale','padX','padY','lh','arw','arX','triC','conn','stW','stC','ckW','ckC','kW','pmC','pbC','lnW','lnC','ppos','pW',
  'wdColor','icons','badgeShow','colors','variants','vi','style','dir','design','btnShape','img'];
const contentOf = b => { const o={}; for(const [k,v] of Object.entries(b)){ if(!LAYOUT_KEYS.includes(k)) o[k]=clone(v); } return o; };
function makeBlock(t){
  const v1=BLOCK_DEFS[t].make();
  const base=contentOf(v1);
  const nb=Object.assign(clone(v1), {id:nid(), type:t, vi:0});
  nb.variants=[base, ...(DEF_VARS[t]||[]).map(p=>Object.assign(clone(base), clone(p)))];
  return nb;
}
function syncVariant(b){ if(Array.isArray(b.variants)&&b.variants.length) b.variants[b.vi||0]=contentOf(b); }
function applyVariant(b, vi){
  const v=b.variants[vi]; if(!v) return;
  for(const k of Object.keys(b)){ if(!LAYOUT_KEYS.includes(k)) delete b[k]; }
  Object.assign(b, clone(v)); b.vi=vi;
  renderAll();
  const card=document.querySelector(`#storyboard .lp-card[data-ci="${state.blocks.indexOf(b)}"]`);
  if(card){ card.classList.add('snap-r'); card.addEventListener('animationend',()=>card.classList.remove('snap-r'),{once:true}); }
}

const fk=(f,i,k)=>f+(i!=null&&i!==''?i:'')+(k||'');
function ea(b, field, idx, key){
  const kk=fk(field,idx,key);
  const fs=b.fs&&b.fs[kk]?` style="font-size:${b.fs[kk]}px"`:'';
  return `class="edit" contenteditable="true" spellcheck="false" data-bid="${b.id}" data-field="${field}"${idx!=null?` data-idx="${idx}"`:''}${key?` data-key="${key}"`:''}${fs}`;
}
/* class属性が二重にならないよう、編集する要素はspanで包む */
const E=(b,field,idx,key,cls,tag)=>{ const v=idx!=null?(key?b[field]?.[idx]?.[key]:b[field]?.[idx]):(key?b[field]?.[key]:b[field]); const t=tag||'div';
  return `<${t} ${ea(b,field,idx,key).replace('class="edit"',`class="edit ${cls||''}"`)}>${rich(v)}</${t}>`; };
function slot(b, name, cap, arcls, nobtns){
  const user=b.imgs&&b.imgs[name];
  const h=b.slotH&&b.slotH[name], w=b.slotW&&b.slotW[name];
  const style=`background-image:url('${user||PH}')${h?`;height:${h}px;aspect-ratio:auto`:''}${w?`;width:${w}%;margin-left:auto;margin-right:auto`:''}`;
  return `<div class="lp-imgslot ${arcls||'ar-169'}${user?' filled':''}" data-slot="${name}" data-bid="${b.id}" style="${style}">
    ${nobtns?'':`<div class="slot-hbtns noexport"><button data-act="slotnarrow" data-slot2="${name}" title="横幅をせまく">◀</button><button data-act="slotwide" data-slot2="${name}" title="横幅を広く">▶</button><button data-act="slotup" data-slot2="${name}" title="高さを増やす">▲</button><button data-act="slotdown" data-slot2="${name}" title="高さを減らす">▼</button></div>`}
    <span class="slot-cap noexport">${esc(cap)}</span></div>`;
}
const delBtn=(b,f,i)=>`<button class="itemdel noexport" data-act="deli" data-field="${f}" data-idx="${i}" title="この項目を消す">×</button>`;

function renderBlock(b){

        <div class="hero-stack" style="width:${(b.slotW&&b.slotW.main)||84}%">${slot(b,'main','主役写真（クリックで差しかえ）','ar-43',true)}${E(b,'name',null,null,'lp-name')}</div>`;
      const hw=(b.slotW&&b.slotW.main)||46;

function themeVars(t){

}
function colorVars(c){
  let s='';
  if(c.main) s+=`--main:${c.main};--sub:color-mix(in srgb, ${c.main} 10%, #fff);`;
  if(c.dark) s+=`--dark:${c.dark};`;
  if(c.accent) s+=`--accent:${c.accent};`;
  if(c.hl) s+=`--hl:${c.hl};`;
  if(c.bg) s+=`background:${c.bg};`;

function secStyle(b){

/* 上に切り込む三角の色＝1つ上のブロックの背景色（自分で選んだ色があればそちら） */
function triDefaultFix(){
  document.querySelectorAll('#storyboard .lp-card[data-ci]').forEach(card=>{
    const ci=+card.dataset.ci, b=state.blocks[ci];
    if(!b||!['cause','recommend','method'].includes(b.type)||b.triC) return;
    const prev=document.querySelector(`#storyboard .lp-card[data-ci="${ci-1}"] .lp-block`); if(!prev) return;
    const col=getComputedStyle(prev).backgroundColor;
    card.querySelector('.lp-block').style.setProperty('--tric',col);
    const pick=document.querySelector(`.sp-cv[data-ci="${ci}"][data-key="triC"]`); if(pick) pick.value=rgbToHex(col);
  });
}
/* ヒーロー写真（いちばん奥）がはみ出さないよう高さを確保 */
function heroFloatFix(root){
  (root||document).querySelectorAll('.lp-hero .lp-flow').forEach(flow=>{
    const img=flow.querySelector(':scope > .hero-side'); if(!img) return;
    flow.style.minHeight=Math.ceil((parseFloat(img.style.top)||0)+img.offsetHeight)+'px';
  });
}
function rgbToHex(c){
  const cv=document.createElement('canvas'); cv.width=cv.height=1; const g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillStyle=String(c); g.fillRect(0,0,1,1);
  const d=g.getImageData(0,0,1,1).data; return '#'+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,'0')).join('');
}
/* 左のミニスマホに中身を写す */
let miniQueued=false;
function miniLive(){ if(miniQueued) return; miniQueued=true; requestAnimationFrame(()=>{ miniQueued=false; miniSync(); }); }
function miniSync(){
  const scr=$('#miniScreen'); if(!scr) return;
  const frag=document.createDocumentFragment();
  const sb=document.createElement('div'); sb.className='statusbar'; frag.appendChild(sb);
  document.querySelectorAll('#storyboard .lp-card[data-ci]').forEach(c=>{

}

  const b=state.blocks.find(x=>x.id===el.dataset.bid); if(!b) return;
  const f=el.dataset.field, val=domToMarkup(el).replace(/\n$/,'');
  const idx=el.dataset.idx!=null?+el.dataset.idx:null, key=el.dataset.key||null;
  if(idx==null&&!key&&Array.isArray(b[f])) return;
  const get=o=>idx!=null?(key?o[f]?.[idx]?.[key]:o[f]?.[idx]):(key?o[f]?.[key]:o[f]);
  if(get(b)===val) return;
  pushUndo();
  const put=o=>{ if(!o) return;
    if(idx!=null){ if(key){ if(o[f]?.[idx]) o[f][idx][key]=val; } else if(o[f]) o[f][idx]=val; }
    else if(key){ if(o[f]) o[f][key]=val; } else o[f]=val; };
  put(b); if(Array.isArray(b.variants)) put(b.variants[b.vi||0]);
  miniSync(); renderRail(); save();
}

(()=>{ const fb=$('#fontBubble'), grip=fb.querySelector('.fb-grip');

})();
const selIn=()=>{ const s=getSelection(); return (s&&s.rangeCount&&fbTarget&&fbTarget.contains(s.anchorNode))?s:null; };
function unwrapHits(sel, selector){
  const r=sel.getRangeAt(0); const hits=[...fbTarget.querySelectorAll(selector)].filter(n=>r.intersectsNode(n));
  hits.forEach(n=>{ while(n.firstChild) n.parentNode.insertBefore(n.firstChild,n); n.remove(); });
  return hits.length>0;
}
function wrapSel(html){ const s=getSelection(); const t=s.toString(); if(!t) return false; document.execCommand('insertHTML',false,html(esc(t))); return true; }
let pickRange=null, pickTarget=null, pickMode='color';
$('#fontBubble').addEventListener('mousedown',e=>{
  const pk=e.target.closest('.fb-picker,.fb-upicker');
  if(pk){
    const s=selIn(); if(!s||s.isCollapsed){ e.preventDefault(); toast('色を変えたい文字をドラッグで選んでから押してください'); return; }
    pickRange=s.getRangeAt(0).cloneRange(); pickTarget=fbTarget; pickMode=pk.classList.contains('fb-upicker')?'ul':'color'; clearTimeout(fbHide); return;
  }
  e.preventDefault();

  const u=e.target.closest('[data-fbu]');
  if(u){ const s=selIn(); if(!s||s.isCollapsed) return need('下線を引きたい文字をドラッグで選んでから押してください');
    if(wrapSel(t=>`<span class="ulx" style="text-decoration:underline;text-decoration-color:${u.dataset.fbu};text-decoration-thickness:.14em;text-underline-offset:.12em">${t}</span>`)) writeBack(fbTarget); return; }
  if(e.target.closest('[data-fb2]')){ const s=selIn(); if(!s) return need('太字にしたい文字をドラッグで選んでから押してください');
    if(unwrapHits(s,'strong,b')||(!s.isCollapsed&&wrapSel(t=>`<strong class="em">${t}</strong>`))) writeBack(fbTarget); else need('太字にしたい文字をドラッグで選んでから押してください'); return; }
  if(e.target.closest('[data-fbm]')){ const s=selIn(); if(!s) return need('マーカーを引きたい文字をドラッグで選んでから押してください');
    if(unwrapHits(s,'mark')||(!s.isCollapsed&&wrapSel(t=>`<mark class="hl">${t}</mark>`))) writeBack(fbTarget); else need('マーカーを引きたい文字をドラッグで選んでから押してください'); return; }
  if(e.target.closest('[data-fbuoff]')){ const s=selIn(); if(!s) return need('消したい下線の文字をクリック（または選択）してから押してください');
    if(unwrapHits(s,'.ulx,u')) writeBack(fbTarget); else need('カーソルの位置に下線が見つかりません'); return; }
  const c=e.target.closest('[data-fbc]');
  if(c){ const s=selIn(); if(!s||s.isCollapsed) return need('色を変えたい文字をドラッグで選んでから押してください');

    if(c.dataset.fbc==='reset') document.execCommand('removeFormat'); else document.execCommand('foreColor',false,c.dataset.fbc);
    writeBack(fbTarget); return; }
  const btn=e.target.closest('[data-fb]'); if(!btn) return;
  const b=state.blocks.find(x=>x.id===fbTarget.dataset.bid); if(!b) return;
  const key=fk(fbTarget.dataset.field, fbTarget.dataset.idx!=null?fbTarget.dataset.idx:null, fbTarget.dataset.key||null);
  pushUndo(); b.fs=b.fs||{};
  if(btn.dataset.fb==='reset'){ delete b.fs[key]; fbTarget.style.fontSize=''; miniLive(); save(); return; }
  const cur=b.fs[key]||Math.round(parseFloat(getComputedStyle(fbTarget).fontSize));
  b.fs[key]=Math.round(Math.max(9,cur*(btn.dataset.fb==='plus'?1.12:0.9)));

/* =========================================================
   クリック操作
   ========================================================= */
let pendingSlot=null;
const UNDOABLE=['slotup','slotdown','slotnarrow','slotwide','deli','addi','cardup','carddown','carddup','carddel','design','vgo','tricopy','adddate'];
$('#storyboard').addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    const bidEl=act.closest('[data-bid]');
    const ci=act.dataset.ci!=null?+act.dataset.ci:(bidEl?state.blocks.findIndex(x=>x.id===bidEl.dataset.bid):-1);
    const b=state.blocks[ci];
    if(a==='insplus'){ openInsPop(+act.dataset.at, act); return; }
    if(!b) return;
    if(UNDOABLE.includes(a)) pushUndo();
    if(a==='slotup'||a==='slotdown'){
      e.stopPropagation(); const n=act.dataset.slot2, el=act.closest('.lp-imgslot');
      b.slotH=b.slotH||{}; const cur=b.slotH[n]||Math.round(el.offsetHeight);
      b.slotH[n]=Math.max(80,cur+(a==='slotup'?40:-40)); renderAll(); return;
    }
    if(a==='slotnarrow'||a==='slotwide'){
      e.stopPropagation(); const n=act.dataset.slot2, el=act.closest('.lp-imgslot');
      b.slotW=b.slotW||{}; const cur=b.slotW[n]||Math.round(el.offsetWidth/(el.parentElement.clientWidth||750)*100);
      b.slotW[n]=Math.min(100,Math.max(24,cur+(a==='slotwide'?6:-6))); renderAll(); return;
    }
    if(a==='deli'){
      const arr=b[act.dataset.field]; arr.splice(+act.dataset.idx,1);
      if(!arr.length && act.dataset.field!=='dates'){ state.blocks.splice(ci,1); renderAll(); toast('項目がなくなったのでブロックごと削除しました（↩で戻せます）'); return; }
      syncVariant(b); renderAll(); return;
    }
    if(a==='addi'){
      const arr=b[act.dataset.field]; if(!Array.isArray(arr)) return;
      if(b.type==='badges'&&arr.length>=6){ undoStack.pop(); toast('メダルは6個までです'); return; }
      const last=arr[arr.length-1]; arr.push(last&&typeof last==='object'?clone(last):'新しい項目');
      syncVariant(b); renderAll(); return;
    }
    if(a==='vgo'){ applyVariant(b,+act.dataset.vi); return; }
    if(a==='tricopy'){
      const prev=document.querySelector(`#storyboard .lp-card[data-ci="${ci-1}"] .lp-block`);
      if(!prev){ undoStack.pop(); toast('このカードの上にブロックがありません'); return; }
      b.triC=rgbToHex(getComputedStyle(prev).backgroundColor); renderAll(); toast('三角を上のブロックの背景色に合わせました'); return;
    }
    if(a==='design'){
      const f=act.dataset.f, v=JSON.parse(act.dataset.v);
      if(b.type==='cta'&&f==='style'){ setCtaStyle(v); return; }
      b[f]=v;
      if(b.type==='hero'&&f==='lay'){ b.slotW=b.slotW||{}; b.slotH=b.slotH||{};
        if(v==='stack'){ b.slotW.main=84; b.slotH.main=340; b.titleW=100; } else { b.slotW.main=46; b.slotH.main=250; b.imgX=1; b.imgY=0; b.titleW=60; } }
      renderAll(); return;
    }
    if(a==='adddate'){
      b.dates=b.dates||[]; if(b.dates.length>=5){ undoStack.pop(); toast('日程は5つまでです'); return; }
      const t=new Date(); b.dates.push({d:`${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`,t:'20:00'});
      b.dates.sort((x,y)=>(x.d||x)<(y.d||y)?-1:1); syncVariant(b); renderAll(); return;
    }
    if(a==='cardcolor'){ openColorPop(ci, act); return; }
    if(a==='cardup'){ if(ci>0) moveCard(ci,ci-1); else undoStack.pop(); return; }
    if(a==='carddown'){ if(ci<state.blocks.length-1) moveCard(ci,ci+1); else undoStack.pop(); return; }
    if(a==='carddup'){ const c=clone(b); c.id=nid(); state.blocks.splice(ci+1,0,c); renderAll(); toast('カードを複製しました'); return; }
    if(a==='carddel'){ state.blocks.splice(ci,1); renderAll(); toast('カードを削除しました（↩で戻せます）'); return; }
    if(a==='cardjpeg'){ exportOne(ci); return; }
    return;
  }
  const slotEl=e.target.closest('.lp-imgslot');
  if(slotEl){ pendingSlot={bid:slotEl.dataset.bid, name:slotEl.dataset.slot}; $('#imgPick').value=''; $('#imgPick').click(); }
});

/* CTAの色は全部のCTAで連動（ボタン文言も合わせる） */
const CTA_BTNS={line:['LINEで特典を受け取る','今すぐ無料で受け取る','無料でLINE登録する','LINEで受け取る','LINEで無料で受け取る'],
  seminar:['今すぐ無料で参加する','無料で参加する','セミナーに申し込む','参加席を確保する','今すぐ申し込む']};
function setCtaStyle(style){
  const swap=s=>style==='seminar'?String(s).replace(/LINE/g,'セミナー'):String(s).replace(/セミナー/g,'LINE');
  state.blocks.forEach(b=>{ if(b.type!=='cta') return; b.style=style; b.btn=CTA_BTNS[style][(b.vi||0)%5]; b.heading=swap(b.heading);
    (b.variants||[]).forEach((v,i)=>{ if('btn' in v) v.btn=CTA_BTNS[style][i%5]; if('heading' in v) v.heading=swap(v.heading); }); });
  renderAll(); toast(style==='seminar'?'全部のCTAをセミナー申込（赤）に切りかえました':'全部のCTAをLINE登録（緑）に切りかえました');
}

let padDrag=null;
$('#storyboard').addEventListener('pointerdown',e=>{
  const pad=e.target.closest('.pad'); if(!pad) return;
  padDrag={kind:pad.dataset.pad, ci:+pad.dataset.ci, rect:pad.getBoundingClientRect(), el:pad};
  pushUndo(); try{ pad.setPointerCapture(e.pointerId); }catch(_){}
  padMove(e); e.preventDefault();
});
$('#storyboard').addEventListener('pointermove',e=>{ if(padDrag) padMove(e); });
const padEnd=()=>{ if(!padDrag) return; padDrag=null; document.querySelectorAll('.pad-overlay').forEach(o=>o.remove()); renderAll(); };
$('#storyboard').addEventListener('pointerup',padEnd);
$('#storyboard').addEventListener('pointercancel',padEnd);
function padMove(e){
  const {kind,ci,rect,el}=padDrag, b=state.blocks[ci]; if(!b) return;
  const x=clamp01((e.clientX-rect.left)/rect.width), y=clamp01((e.clientY-rect.top)/rect.height);
  const sec=document.querySelector(`#storyboard .lp-card[data-ci="${ci}"] .lp-block`);
  const d=el.querySelector('.xy-dot'); if(d){ d.style.left=(x*100)+'%'; d.style.top=(y*100)+'%'; }
  if(kind==='xy'){
    b.padX=Math.round(x*80); b.padY=Math.round((1-y)*80);
    if(sec){ sec.setAttribute('style',secStyle(b));
      let ov=sec.querySelector(':scope > .pad-overlay'); if(!ov){ ov=document.createElement('div'); ov.className='pad-overlay noexport'; sec.appendChild(ov); }
      ov.style.borderWidth=`${b.padY}px ${b.padX}px`; }
  } else if(kind==='tri'){
    const arDef=b.type==='bridge'?34/375:0.12;
    b.arX=+(x<=0.5?0.02+(x/0.5)*(arDef-0.02):arDef+((x-0.5)/0.5)*(1-arDef)).toFixed(3);
    b.arw=+(y<=0.5?0.4+(y/0.5)*0.6:1+((y-0.5)/0.5)*1.2).toFixed(2);
    if(sec){ const tc=sec.style.getPropertyValue('--tric'); sec.setAttribute('style',secStyle(b)); if(tc&&!b.triC) sec.style.setProperty('--tric',tc); }
  } else if(kind==='img'){
    b.slotW=b.slotW||{}; b.slotH=b.slotH||{};
    b.slotW.main=Math.round(24+x*76); b.slotH.main=Math.round(120+(1-y)*440);
    const side=sec&&sec.querySelector('.hero-side,.hero-stack');
    if(side){ side.style.width=b.slotW.main+'%'; if(side.classList.contains('hero-side')) side.style.left=((100-b.slotW.main)*(b.imgX!=null?b.imgX:1)).toFixed(1)+'%'; }
    const im=sec&&sec.querySelector('.lp-imgslot[data-slot="main"]'); if(im){ im.style.height=b.slotH.main+'px'; im.style.aspectRatio='auto'; }
    if(sec) heroFloatFix(sec);
  } else if(kind==='pos'){
    b.imgX=+x.toFixed(3); b.imgY=Math.round(y*300);
    const side=sec&&sec.querySelector('.hero-side');
    if(side){ const w=(b.slotW&&b.slotW.main)||46; side.style.left=((100-w)*b.imgX).toFixed(1)+'%'; side.style.top=b.imgY+'px'; }

   書き出し（JPEG・幅1500px＝750pxの2倍）
   ========================================================= */
const FONT_FAMILIES='family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@600;800&family=Yomogi';
const fontCache=new Map();
const toDataURL=blob=>new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(blob); });
async function fontCSSFor(text){
  // 日本語フォントはとても大きいので、そのカードで使っている文字だけのフォントを取り寄せる
  const chars=[...new Set([...(text+'✓!●▼▶★×特典0123456789')].filter(ch=>ch.trim()))].join('');
  if(fontCache.has(chars)) return fontCache.get(chars);
  let css=await (await fetch(`https://fonts.googleapis.com/css2?${FONT_FAMILIES}&text=${encodeURIComponent(chars)}&display=swap`)).text();
  const urls=[...new Set((css.match(/url\((https:[^)]+)\)/g)||[]).map(u=>u.slice(4,-1)))];
  await Promise.all(urls.map(async u=>{ const d=await toDataURL(await (await fetch(u)).blob()); css=css.split(u).join(d); }));
  fontCache.set(chars,css); return css;
}
async function cardCanvas(ci){
  const src=document.querySelector(`#storyboard .lp-card[data-ci="${ci}"]`); if(!src) return null;
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-30000px;top:0;width:750px;';
  const c=src.cloneNode(true);
  c.removeAttribute('data-ci'); c.style.boxShadow='none';
  c.querySelectorAll('.noexport').forEach(n=>n.remove());
  c.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));
  holder.appendChild(c); document.body.appendChild(holder);
  try{
    heroFloatFix(c);
    let css=''; try{ css=await fontCSSFor(c.textContent); }catch(err){ console.warn('フォントを取り寄せられませんでした',err); }
    const w=c.offsetWidth, h=c.offsetHeight, R=2;
    const url=await htmlToImage.toSvg(c,{width:w,height:h,...(css?{fontEmbedCSS:css}:{skipFonts:true})});
    const im=new Image(); await new Promise((ok,ng)=>{ im.onload=ok; im.onerror=()=>ng(new Error('画像にできませんでした')); im.src=url; });
    try{ await im.decode(); }catch(_){}
    const cv=document.createElement('canvas'); cv.width=w*R; cv.height=h*R;
    const g=cv.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(im,0,0,cv.width,cv.height);
    return cv;
  } finally { holder.remove(); }
}
const toBlob=(cv,q)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q||.93));
const cardName=ci=>(BLOCK_DEFS[state.blocks[ci].type]?.label||state.blocks[ci].type).replace(/[\\/:*?"<>|（）()]/g,'');
async function busy(fn){
  if(typeof htmlToImage==='undefined'){ toast('書き出しの道具が読みこめていません インターネットにつないで開きなおしてください'); return; }
  if(document.body.classList.contains('view-done')){ toast('書き出しは「分割して編集」の画面で行います'); return; }
  document.activeElement?.blur?.();
  const btns=document.querySelectorAll('.side-menu .go'); btns.forEach(b=>b.disabled=true);
  toast('書き出し中です…');
  try{ await document.fonts.ready; await fn(); } catch(err){ console.error(err); toast('書き出しに失敗しました：'+(err.message||err)); }
  finally{ btns.forEach(b=>b.disabled=false); }
}
function exportOne(ci){ return busy(async()=>{ const cv=await cardCanvas(ci); downloadBlob(await toBlob(cv),`${slug()}-${pad2(ci+1)}-${cardName(ci)}.jpg`); toast('このカードをJPEGで書き出しました（ダウンロードフォルダ）'); }); }
$('#ex-jpeg-zip').onclick=()=>busy(async()=>{

/* 合体出力：縦2500px（スマホ1枚分強）までつなぐ。CTAのあとで区切る（最後のCTAの次がフッターだけならつなげる） */
$('#ex-jpeg-merge').onclick=()=>busy(async()=>{
  const n=state.blocks.length; if(!n) return toast('ブロックがありません');
  const cvs=[]; for(let i=0;i<n;i++) cvs.push(await cardCanvas(i));
  const MAX=2500*2, types=state.blocks.map(b=>b.type);
  const groups=[]; let g=[], gh=0;
  cvs.forEach((cv,i)=>{
    if(g.length&&gh+cv.height>MAX){ groups.push(g); g=[]; gh=0; }
    g.push(cv); gh+=cv.height;
    const footerNext=(i===n-2&&types[n-1]==='footer');
    if(types[i]==='cta'&&!footerNext){ groups.push(g); g=[]; gh=0; }
  });
  if(g.length) groups.push(g);
  const outs=[];
  for(const grp of groups){
    const w=Math.max(...grp.map(c=>c.width)), h=grp.reduce((s,c)=>s+c.height,0);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h);
    let y=0; grp.forEach(c=>{ x.drawImage(c,0,y); y+=c.height; }); outs.push(await toBlob(cv,.92));
  }
  if(outs.length===1) downloadBlob(outs[0],`${slug()}-merged.jpg`);
  else { const zip=new JSZip(); outs.forEach((b,i)=>zip.file(`${pad2(i+1)}-merged.jpg`,b)); downloadBlob(await zip.generateAsync({type:'blob'}),`${slug()}-merged-jpeg.zip`); }
  toast(`カード${n}枚を合体JPEG ${outs.length}枚にまとめました（ダウンロードフォルダ）`);
});

   読みこみ・ひな形・はじまり
   ========================================================= */
function loadState(data){
  state.meta=Object.assign({title:'無題のLP'},data.meta||{});
  state.theme=Object.assign({main:'#8B6DB5',dark:'#3A2B5C',accent:'#c9a96e',hl:'#ffe98a',headfont:'gothic'},data.theme||{});
  state.blocks=(data.blocks||[]).filter(b=>BLOCK_DEFS[b.type]).map(b=>{
    const nb=Object.assign(BLOCK_DEFS[b.type].make(), clone(b));
    nb.id=b.id||nid();
    if(nb.pad!=null&&nb.padX==null){ nb.padX=nb.pad; nb.padY=nb.pad; delete nb.pad; }
    if(Array.isArray(nb.variants)&&nb.variants.length>1){ nb.vi=Math.min(nb.vi||0,nb.variants.length-1); }
    else { nb.variants=[contentOf(nb)]; nb.vi=0; }
    if(nb.variants.length<5&&DEF_VARS[b.type]){
      const base=nb.variants[0], seen=new Set(nb.variants.map(v=>JSON.stringify(v)));
      for(const p of DEF_VARS[b.type]){ if(nb.variants.length>=5) break; const cand=Object.assign(clone(base),clone(p)); const k=JSON.stringify(cand); if(!seen.has(k)){ nb.variants.push(cand); seen.add(k); } }
    }
    return nb;
  });
  syncInputs(); applyThemeWith(state.theme); renderAll();
